<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RAM-99: Task Manager Survival</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100dvh; width: 100vw; overflow: hidden; background: #121417; color: #ECEFF4; font-family: system-ui, -apple-system, sans-serif; touch-action: manipulation; }
  #root { height: 100dvh; display: flex; flex-direction: column; }

  /* Header Monitor (56px) */
  header { height: 56px; display: flex; flex-direction: column; border-bottom: 2px solid #1C2026; padding: 4px 8px; gap: 4px; }
  .ram-row { display: flex; align-items: center; justify-content: space-between; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; font-weight: 700; }
  .ram-label { color: #38BDF8; }
  .ram-pct { color: #ECEFF4; }
  .ram-bar { height: 6px; background: #1C2026; border: 1px solid #38BDF8; border-radius: 2px; overflow: hidden; margin-top: 2px; }
  .ram-fill { height: 100%; width: 0%; background: #38BDF8; transition: width 0.15s ease; }
  .ram-fill.danger { background: #EF4444; }
  .hud-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
  .hud-btn { background: #1C2026; border: 1px solid #38BDF8; color: #ECEFF4; padding: 2px 8px; border-radius: 2px; cursor: pointer; font-size: 11px; font-family: inherit; }
  .hud-btn:active { border-bottom: 3px solid #38BDF8; transform: translateY(1px); }

  /* Incoming Queue (40px) */
  .queue { height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 4px 8px; border-bottom: 2px solid #1C2026; gap: 6px; }
  .queue-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #38BDF8; font-weight: 700; }
  .queue-items { display: flex; gap: 4px; flex: 1; min-width: 0; }
  .queue-cell { width: 34px; height: 34px; border: 1px dashed #1C2026; border-radius: 2px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #ECEFF4; background: #1C2026; flex-shrink: 0; }
  .queue-tools { display: flex; gap: 4px; }
  .tool-btn { background: #1C2026; border: 1px solid #38BDF8; color: #ECEFF4; width: 34px; height: 34px; border-radius: 2px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
  .tool-btn:active { border-bottom: 3px solid #38BDF8; transform: translateY(1px); }

  /* Grid 8x8 */
  .grid-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px; border-bottom: 2px solid #1C2026; }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); gap: 2px; width: min(90vw, 320px); height: min(90vw, 320px); aspect-ratio: 1/1; border: 2px solid #38BDF8; border-radius: 4px; background: #0a0c0f; }
  .cell { aspect-ratio: 1/1; background: #1C2026; border: 1px solid #121417; border-radius: 2px; position: relative; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; color: #ECEFF4; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
  .cell:active { transform: scale(0.96); transition: transform 0.05s; }
  .cell.empty { background: #0a0c0f; }
  .cell.app-tab { background: rgba(56, 189, 248, 0.15); border-color: #38BDF8; color: #38BDF8; }
  .cell.memory-leak { background: rgba(249, 115, 22, 0.15); border-color: #F97316; color: #F97316; }
  .cell.freeze-bloatware { background: rgba(34, 211, 238, 0.15); border-color: #22D3EE; color: #22D3EE; }
  .cell.background-tracker { background: rgba(168, 85, 247, 0.15); border-color: #A855F7; color: #A855F7; }
  .cell.zipped { background: #10B981; color: #fff; }
  .cell.frozen { border: 2px solid #22D3EE; position: relative; }
  .cell.frozen::after { content: '\1F512'; position: absolute; top: 2px; right: 2px; font-size: 10px; }
  .cell.incoming { border-style: dashed; border-color: rgba(236, 72, 203, 0.4); }
  .cell.cluster-ready { box-shadow: inset 0 0 0 2px #10B981; animation: pulse 2s infinite; }
  .cell.symbol { font-size: 18px; font-weight: 700; line-height: 1; margin: 2px 0; }
  .cell.tier { font-size: 10px; position: absolute; top: 2px; left: 4px; opacity: 0.8; }
  .cell.timer { font-size: 10px; position: absolute; bottom: 2px; right: 4px; font-weight: 700; opacity: 0.9; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  .cell.danger-border { border-color: #EF4444; box-shadow: 0 0 0 1px #EF4444; }

  /* Control Dock (72px) */
  .dock { height: 72px; display: flex; flex-direction: column; gap: 4px; padding: 6px 8px; border-top: 2px solid #1C2026; }
  .cpu-row { display: flex; align-items: center; gap: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 700; }
  .cpu-label { color: #38BDF8; }
  .cpu-dots { display: flex; gap: 4px; }
  .cpu-dot { width: 14px; height: 14px; border: 2px solid #38BDF8; border-radius: 2px; }
  .cpu-dot.filled { background: #38BDF8; }
  .cpu-dot.empty { background: transparent; }
  .actions { display: flex; gap: 6px; }
  .btn { flex: 1; padding: 6px 4px; border: 1px solid #38BDF8; color: #ECEFF4; background: #1C2026; border-radius: 2px; cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 700; text-transform: uppercase; }
  .btn:active { border-bottom: 3px solid #38BDF8; transform: translateY(1px); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; border-color: #4b5563; color: #9ca3af; }
  .btn.force-stop { border-color: #F97316; color: #F97316; }
  .btn.force-stop.active { background: #F97316; color: #121417; }
  .btn.end-turn { background: #38BDF8; color: #121417; border-color: #38BDF8; }

  .overlay { position: fixed; inset: 0; background: rgba(18, 20, 23, 0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 50; }
  .overlay.visible { display: flex; }
  .panel { background: #1C2026; border: 2px solid #38BDF8; border-radius: 4px; padding: 16px; min-width: 240px; text-align: center; }
  .panel h2 { margin: 0 0 12px; font-size: 18px; color: #ECEFF4; }
  .panel p { margin: 0 0 16px; font-size: 14px; color: #9ca3af; }
  .panel .btn { margin: 0 4px; }
</style>
</head>
<body>
<div id="root">
  <header>
    <div class="ram-row">
      <span class="ram-label">MEM</span>
      <span class="ram-pct" id="ramPct">0 / 99%</span>
      <span class="ram-label">UPTIME</span>
      <span class="ram-pct" id="uptime">0T</span>
      <button class="hud-btn" id="btnMute">MUTE</button>
      <button class="hud-btn" id="btnRestart">RESTART</button>
    </div>
    <div class="ram-bar"><div class="ram-fill" id="ramFill"></div></div>
    <div class="hud-row">
      <span id="hudStatus">Siap</span>
      <span id="cpuCycles">CPU: 3/3</span>
    </div>
  </header>

  <div class="queue">
    <span class="queue-label">NEXT</span>
    <div class="queue-items" id="queueItems"></div>
    <div class="queue-tools">
      <button class="tool-btn" id="btnSound">🔊</button>
      <button class="tool-btn" id="btnRefresh">↻</button>
    </div>
  </div>

  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>

  <div class="dock">
    <div class="cpu-row">
      <span class="cpu-label">CPU CYCLES</span>
      <div class="cpu-dots" id="cpuDots"></div>
    </div>
    <div class="actions">
      <button class="btn force-stop" id="btnForceStop">FORCE STOP (2)</button>
      <button class="btn" id="btnUndo">UNDO</button>
      <button class="btn end-turn" id="btnEndTurn">END TURN</button>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="panel">
      <h2 id="overlayTitle">Kernel Panic</h2>
      <p id="overlayMsg">Beban RAM mencapai 99%</p>
      <button class="btn end-turn" id="btnPlayAgain">MAIN LAGI</button>
    </div>
  </div>
</div>
<script type="module" src="src/main.ts"></script>
</body>
</html>
